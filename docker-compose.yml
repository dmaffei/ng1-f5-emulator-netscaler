services:

  mock-nitro:
    build: ./mock-nitro
    container_name: netscaler-vip-emulator-for-ng1
    restart: unless-stopped
    ports:
      - "${TMOS_HOST_IP}:9080:9080"
    volumes:
      - ./mock-nitro/mock-config.yml:/app/mock-config.yml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9080/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  tmos-shim-netscaler:
    build: .
    container_name: tmos-shim-netscaler
    restart: unless-stopped
    depends_on:
      mock-nitro:
        condition: service_healthy
    ports:
      - "${TMOS_HOST_IP}:8446:8443"
    volumes:
      - ./certs:/app/certs:ro
      - ./backends/netscaler.yml:/app/backends.yml:ro
    env_file: [ .env ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8443/health',context=ctx)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
