# NetScaler NITRO backend — points at mock-nitro container
# Switch host/port/ssl to target a real VPX when available

netscaler:
  type: netscaler
  host: mock-nitro       # Docker service name; use real VPX IP for production
  port: 9080
  ssl: false
  username: nsroot
  password: nsroot
  vip_host: 192.168.30.32  # IP nG1 will see for VIPs (this host)
