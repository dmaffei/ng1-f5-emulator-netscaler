# NetScaler backend — update host/credentials for your environment
# For live VPX: set host to NSIP, ssl: true, verify_ssl: false
# For mock emulator: set host to mock-nitro, port: 9080, ssl: false
netscaler:
  type: netscaler
  host: mock-nitro
  port: 9080
  ssl: false
  verify_ssl: false
  username: nsroot
  password: nsroot
  vip_host: mock-nitro
